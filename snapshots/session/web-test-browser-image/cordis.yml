- id: llm-deepseek
  disabled: true
- id: agent-default-model
  config:
    provider: deepseek-official
    model: deepseek-v4-flash-vision-exp
- id: session-persistence-jsonl
  config:
    root: !!js dshHomePath('sessions')
    compression: none
- insert:
    - id: llm-replay
      name: '@deepseek-ai/dsh-llm-replay'
      config:
        providers:
          - id: deepseek-official
            name: DeepSeek
            models:
              - id: deepseek-v4-flash-vision-exp
                inputModalities: [text, image]
                imageRequestTokens: 169
    - id: browser-use
      name: '@deepseek-ai/dsh-browser-use'
    - id: web-test-browser-image-fixture
      name: './provider-fixture.mjs'
- id: tool-bash
  disabled: true
- id: tool-pwsh
  disabled: true
- id: agent-instructions
  disabled: true
- id: skill-filesystem
  disabled: true
- id: system-prompt
  config:
    personaPrefix: 'Test a stored screenshot image through the actual Web testing policy. The carrier is a unit fixture; no Native page is controlled.'
