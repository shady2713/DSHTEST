- id: llm-deepseek
  name: '@deepseek-ai/dsh-llm-deepseek-api-key'
  disabled: true

- id: plugin-package-inventory-deepseek
  disabled: true

- id: session-title-llm
  disabled: true

- id: session-persistence-jsonl
  config:
    root: !!js dshHomePath('sessions')
    compression: none

- id: ptc-runtime
  disabled: true

- id: tools
  config:
    mode: ptc

- id: tool-bash
  disabled: true

- id: tool-pwsh
  disabled: true

- id: agent-instructions
  disabled: true

- id: skill-filesystem
  disabled: true

- id: system-prompt
  config:
    personaPrefix: 'Verify isolated Web testing programs and protected file refusals using the declared tools. All fixture files are public synthetic data.'

- insert:
    - id: llm-replay
      name: '@deepseek-ai/dsh-llm-replay'
      config:
        providers:
          - id: deepseek-official
            name: DeepSeek
            models:
              - id: deepseek-v4-flash
              - id: deepseek-v4-pro
    - id: web-test-quickjs-fixture
      name: './provider-fixture.mjs'
