- id: llm-deepseek
  name: '@deepseek-ai/dsh-llm-deepseek-api-key'
  disabled: true

- id: session-persistence-jsonl
  name: '@deepseek-ai/dsh-session-persistence-jsonl'
  config:
    root: !!js dshHomePath('sessions')
    compression: none

- insert:
    - id: llm-replay
      name: '@deepseek-ai/dsh-llm-replay'
      config:
        providers:
          - id: deepseek-official
            name: DeepSeek
            models:
              - id: deepseek-v4-flash
              - id: deepseek-v4-pro

- insert:
    - id: browser-use
      name: '@deepseek-ai/dsh-browser-use'
    - id: web-test-browser-outcomes-fixture
      name: './provider-fixture.mjs'

- id: tool-bash
  disabled: true

- id: tool-pwsh
  disabled: true

- id: agent-instructions
  disabled: true

- id: skill-filesystem
  disabled: true

- id: system-prompt
  config:
    personaPrefix: 'You are testing browser tool result handling. The browser transport is a deterministic fixture; no real page is controlled.'
